# Netlify / Cloudflare Pages deploy konfiguracija za Lekta (ThesisReady).
# Javni statični build: klijentska aplikacija, bez backenda. Sva analiza je lokalna u pregledniku.
#
# DEPLOY=1 iskljucuje internu verifikacijsku konzolu (verification.html) iz builda, pa se ne
# objavljuje admin alat ni ~163MB source PDF-ova; javni bundle je ~3MB. Sigurnosna zaglavlja
# (CSP itd.) dolaze iz public/_headers koji Vite kopira u dist/.
#
# Cloudflare Pages: isti build command i output dir postave se u dashboardu (Pages projekt),
# _headers se jednako primjenjuje.

[build]
  # generate-citation-tools MORA ici POSLIJE `vite build` (vite prazni dist/ pri buildu), pa
  # potom doda staticke SEO stranice u dist/alati/** koje se objave iz istog artefakta.
  # Naslovnica NEMA zasebne per-fakultet stranice: sve opcije su na jednom alatu naslovnica.html
  # (kaskada fakultet/razina/smjer), pa se generate-title-page-tools NE poziva.
  # generate-coverage-page: javna coverage matrica (VERIFICATION_PIPELINE.md sekcija 9),
  # cita samo vec-preracunate JSON podatke (scored-coverage.json), pa ne treba nikakav poredak
  # naspram ostalih generatora, samo da bude poslije `vite build`.
  # generate-faculty-pages: SEO landing stranice po (fakultet x vrsta rada), npr. /fpzg/diplomski-rad/.
  # Pilot opseg (PILOT_UNITS na vrhu skripte) - siri se rucno nakon pregleda kvalitete izlaza.
  # generate-competitor-pages: /usporedba/<slug>/ podstranice (P2b), svaka tvrdnja izvorena
  # preko data/competitors/competitor-facts.json; poredak prema drugim generatorima nebitan,
  # samo mora biti poslije `vite build` i prije zavrsnog verify gatea.
  command = "npm run build && npm run generate-citation-tools && npm run generate-legal-pages && npm run generate-coverage-page && npm run generate-faculty-pages && npm run generate-competitor-pages && node scripts/verify-deploy-dist.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  DEPLOY = "1"
  # Generator citata pece kanonske URL-ove i sitemap iz ove domene (BEZ zavrsne kose crte,
  # inace bi ${ORIGIN}/alati/... dalo dvostruki //). Ziva domena je Netlify subdomena.
  LEKTA_SITE_ORIGIN = "https://lektahr.netlify.app"
