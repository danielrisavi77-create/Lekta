# Netlify / Cloudflare Pages deploy konfiguracija za Lekta (ThesisReady).
# Javni statični build: klijentska aplikacija, bez backenda. Sva analiza je lokalna u pregledniku.
#
# DEPLOY=1 iskljucuje internu verifikacijsku konzolu (verification.html) iz builda, pa se ne
# objavljuje admin alat ni ~163MB source PDF-ova; javni bundle je ~3MB. Sigurnosna zaglavlja
# (CSP itd.) dolaze iz public/_headers koji Vite kopira u dist/.
#
# Cloudflare Pages: isti build command i output dir postave se u dashboardu (Pages projekt),
# _headers se jednako primjenjuje.

[build]
  # generate-citation-tools MORA ici POSLIJE `vite build` (vite prazni dist/ pri buildu), pa
  # potom doda staticke SEO stranice u dist/alati/** koje se objave iz istog artefakta.
  # generate-coverage-page: javna coverage matrica (VERIFICATION_PIPELINE.md sekcija 9),
  # cita samo vec-preracunate JSON podatke (scored-coverage.json), pa ne treba nikakav poredak
  # naspram ostalih generatora, samo da bude poslije `vite build`.
  # generate-faculty-pages: SEO landing stranice po (fakultet x vrsta rada), npr. /fpzg/diplomski-rad/.
  # Pilot opseg (PILOT_UNITS na vrhu skripte) - siri se rucno nakon pregleda kvalitete izlaza.
  # generate-title-page-tools (B5): SEO landing stranice po fakultetu za naslovnicu
  # (dist/alati/naslovnica/<unit>[-<razina>].html), SAMO za fakultete sa provenance.status
  # 'official' (doslovan citat pravilnika) - honesty-gate u samoj skripti, ne noindex grana.
  # generate-competitor-pages: /usporedba/<slug>/ podstranice (P2b), svaka tvrdnja izvorena
  # preko data/competitors/competitor-facts.json; poredak prema drugim generatorima nebitan,
  # samo mora biti poslije `vite build` i prije zavrsnog verify gatea.
  command = "npm run build && npm run build-info && npm run generate-citation-tools && npm run generate-legal-pages && npm run generate-coverage-page && npm run generate-faculty-pages && npm run generate-title-page-tools && npm run generate-competitor-pages && node scripts/verify-deploy-dist.mjs"
  publish = "dist"

[build.environment]
  # ISTA VERZIJA KAO CI, i to je uvjet a ne uskladjivanje radi urednosti.
  #
  # `dist-gate` (`.github/workflows/check.yml`) vrti DOSLOVNO gornji `command`, pa
  # `verify-deploy-dist` i ux testove nad `dist/`. Time CI odgovara na pitanje "gradi li se
  # produkcijski artefakt" na svaki push. Ta zamjena vrijedi SAMO ako obje strane grade istim
  # runtimeom; dok je CI bio na 24 a ovdje 20, "CI zelen" nije znacilo "Netlify zelen".
  #
  # Podize se Netlify na 24, a ne CI na 20: Node 20 je izasao iz podrske, pa bi spustanje CI-ja
  # bilo korak unatrag. Provjereno 2026-09-09 prije izmjene: cijeli lanac (vite build + svih
  # sedam generatora + verify-deploy-dist) prolazi i na 20 i na 24, pa ovo NIJE popravak
  # tekuceg pada deploya nego uklanjanje razlike zbog koje se pad ne bi vidio u CI-u.
  NODE_VERSION = "24"
  DEPLOY = "1"
  # Generator citata pece kanonske URL-ove i sitemap iz ove domene (BEZ zavrsne kose crte,
  # inace bi ${ORIGIN}/alati/... dalo dvostruki //). Ziva domena je Netlify subdomena.
  LEKTA_SITE_ORIGIN = "https://lektahr.netlify.app"
  # DOKAZ O PROVJERAMA JE OBAVEZAN (audit P0-03).
  #
  # `scripts/verify-deploy-dist.mjs` provjerava `docs/generated/RELEASE_PROOF.json` i bez ove
  # zastavice na nalaz samo UPOZORI, pa se moglo deployati bez ijednog dokaza da su Tier 1
  # (python-docx) i Tier 2 (pravi Word) uopce izvedeni. `npm run check` je samo Tier 0 i ne otvara
  # dokument nijednim stvarnim uredivacem.
  #
  # POSLJEDICA KOJU TREBA ZNATI: od trenutka kad ovo udje u master, produkcijski build PADA dok
  # dokaz ne bude potpun, vezan uz ono sto se gradi, nastao nad cistim stablom i mladji od
  # LEKTA_PROOF_MAX_AGE_DAYS (zadano 14). Popravak je `npm run release:check` pa commit dokaza.
  # "Vezan uz ono sto se gradi" se od 2026-09-09 mjeri OTISKOM STABLA (`treeDigest`, bez same
  # datoteke dokaza), ne `git diff`-om medju commitovima: diff je u plitkom klonu tiho prolazio
  # (vanjski audit 2026-09-08, nalaz 1). Dokaz bez otiska ili stablo koje se ne da procitati je
  # "ne znam", i to je pad, ne prolaz.
  # To je namjera gatea, ne nuspojava: zastario dokaz je opasniji od nikakvog jer izgleda kao
  # potvrda za kod koji nitko nije provjerio.
  LEKTA_REQUIRE_RELEASE_PROOF = "1"
