# Staging frontend konfiguracija. Site-specific Supabase varijable postavljaju se u
# Netlify UI ili CLI secrets, nikad u ovaj repozitorij.

[build]
  # Staging mora koristiti isti lanac kao produkcija i CI. Taj lanac izmedju Vite builda i
  # generatora upisuje dist/build-info.json, pa javna objava ima provjerljiv identitet.
  command = "node scripts/build-production.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  DEPLOY = "1"
  VITE_LEKTA_ENV = "staging"
  LEKTA_SITE_ORIGIN = "https://lekta-staging.netlify.app"
