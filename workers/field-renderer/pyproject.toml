[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lekta-field-renderer"
version = "1.0.0"
description = "Sandboxed LibreOffice worker for refreshing Word fields in DOCX files"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]

[tool.setuptools]
py-modules = ["app"]
