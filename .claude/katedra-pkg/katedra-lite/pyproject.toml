[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "katedra-skill"
version = "1.0.1"
description = "Development and verification metadata for the Katedra academic-writing skill."
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.20",
  "PyYAML>=6.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
