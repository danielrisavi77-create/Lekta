<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Lekta &middot; verifikacijska konzola</title>
    <style>
      body { font: 15px/1.55 Arial, sans-serif; color: #172033; max-width: 1000px; margin: 32px auto; padding: 0 20px; background: #f7f8fb; }
      h1 { font-size: 26px; margin: 0 0 6px; }
      h2 { font-size: 17px; margin: 22px 0 2px; }
      code { background: #eef2ff; padding: 1px 6px; border-radius: 6px; font-size: 13px; }
      .vc-head { border: 1px solid #dfe4ee; border-radius: 14px; padding: 18px; background: #fff; }
      .vc-actions { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
      .vc-group { margin-top: 8px; }
      .vc-meta { color: #667085; font-size: 12px; margin: 2px 0 8px; }
      .vc-rule { border: 1px solid #dfe4ee; border-radius: 12px; padding: 12px 14px; margin: 8px 0; background: #fff; }
      .vc-applied { background: #f0fdf4; border-color: #bbf7d0; }
      .vc-rule-head { display: flex; gap: 8px; align-items: center; }
      .vc-badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #e5e7eb; }
      .vc-verified { background: #bbf7d0; }
      .vc-advisory { background: #fde68a; }
      .vc-retired { background: #fecaca; }
      .vc-auth { color: #667085; font-size: 12px; margin-left: auto; }
      .vc-form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0; }
      .vc-form label { display: flex; flex-direction: column; font-size: 11px; color: #667085; gap: 2px; }
      .vc-form input { font: inherit; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 8px; }
      .vc-rule-actions { display: flex; gap: 8px; }
      button { font: inherit; padding: 7px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; cursor: pointer; }
      button[data-act="confirm"] { background: #172033; color: #fff; border-color: #172033; }
      .vc-error { color: #c9364f; font-size: 12px; min-height: 14px; margin: 4px 0 0; }
      .vc-empty { color: #667085; }
      .vc-source-pane { position: sticky; top: 8px; z-index: 5; border: 1px solid #dfe4ee; border-radius: 12px; padding: 8px; margin: 10px 0; background: #fff; box-shadow: 0 6px 20px rgba(23,32,51,.08); }
      .vc-source-cap { font-size: 12px; color: #667085; margin-bottom: 6px; }
      .vc-source-frame { width: 100%; height: 520px; border: 1px solid #cbd5e1; border-radius: 8px; }
      button[data-act="show-source"] { background: #eef2ff; }
    </style>
  </head>
  <body>
    <div id="lekta-verification-console"></div>
    <script type="module" src="/src/ui/verification-console.ts"></script>
  </body>
</html>
