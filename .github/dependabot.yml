# Dependabot (BL-P3-14): automatski PR-ovi za sigurnosne i verzijske zakrpe.
# Tri ekosustava: npm (ovisnosti aplikacije), github-actions (verzije akcija u workflowima) i pip za
# training-pipeline (T99, issue #220, korak 3). Deno Dependabot ne podrzava; tamo je osv-scan job.
# Teski dev CLI (supabase) i, do 2026-10-04, netlify-cli dominirali su lockfileom i nisu u produkcijskom bundleu
# (BL-P2-09), pa im se NE prate major i minor nadogradnje: to je bio cist sum.
#
# PATCH nadogradnje se od 2026-08-17 vise NE ignoriraju (audit TEST-20). Prije su bili iskljuceni
# u cijelosti, a upravo ta dva alata kontroliraju deploy i bazu: sigurnosna zakrpa u njima ticala
# bi se stroja koji objavljuje i migrira, a Dependabot o njoj ne bi ni javio. Patch je uzak pojas
# u kojem takve zakrpe stizu, a lockfile se ne prevrce.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Grupiraj nerizicne minor/patch nadogradnje u jedan PR (manje suma, laksi pregled).
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "supabase"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/training-pipeline"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
