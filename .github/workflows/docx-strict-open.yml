# Tier 1: otvara li se svaki .docx pod NEOVISNOM implementacijom (python-docx + lxml).
#
# Zaseban od check.yml namjerno: python ovisnost ne smije uci u tvrdi build gate (`npm run check`
# ostaje cisti Node lanac). Ovdje se ne mjeri oblikovanje, samo je li paket valjan; oblikovanje
# provjerava Tier 2 (scripts/word-verify/check.ps1), koji trazi Word i vrti se rucno na Windowsu.
#
# Provjeravaju se OBA kraja: ulazni fixturi i ono sto Repair Engine iz njih ISPUSTI. Drugo je
# vaznije, jer je bas izlaz ono sto ide kupcu (vidi RE-47).
name: docx-strict-open

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Jedan aktivan run po grani (audit TEST-18). Bez ovoga vise pusheva u nizu vrti stare i nove
# buildove istovremeno nad istom granom: trose CI minute i, sto je gore, zeleni status starijeg
# commita stigne poslije novijeg pa izgleda kao da je grana ispravna.
# Na master se NE otkazuje: tamo je svaki commit stanje koje mora imati vlastiti dokaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  strict-open:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Instaliraj ovisnosti
        run: |
          npm ci
          pip install python-docx lxml

      - name: Ulazni fixturi se otvaraju
        run: npm run verify:strict-open

      - name: Popravi korpus i provjeri IZLAZ
        run: |
          npm run repair-real-corpus:review
          python scripts/verify-docx/strict-open.py .artifacts/lekta-real-corpus-review

      - name: Upload popravljene pakete kad nesto padne
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: strict-open-failures
          path: .artifacts/lekta-real-corpus-review
          if-no-files-found: warn
