name: Upisnik resync preflight

on:
  push:
    branches: [audit/upisnik-resync-20261006]
    paths:
      - .github/workflows/upisnik-resync-check.yml
      - scripts/resync-upisnik.mts
      - scripts/check-upisnik-readonly.mts
      - tests/upisnik-worktree-guard.test.ts
      - tests/gate-mutations.test.ts
      - src/programs/upisnik-resync.ts
      - src/programs/upisnik-session.ts
      - src/programs/upisnik-record-review.ts
      - src/programs/upisnik-parse.ts
      - tests/upisnik-resync.test.ts
      - tests/upisnik-session.test.ts
      - tests/upisnik-record-review.test.ts
      - tests/upisnik-parse.test.ts
  workflow_dispatch:

# No secret, registry write, Git push, auto-merge or deployment.
permissions:
  contents: read

concurrency:
  group: upisnik-resync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 22
          npm-version: 11.11.0
      - name: Test source integrity, lossless quarantine and conservative diff
        run: node scripts/with-gate-lock.mjs upisnik-resync-tests -- npx vitest run tests/upisnik-resync.test.ts tests/upisnik-parse.test.ts tests/upisnik-session.test.ts tests/upisnik-record-review.test.ts tests/upisnik-worktree-guard.test.ts
      - name: Fetch unfiltered source into review artifacts only
        run: node scripts/with-gate-lock.mjs upisnik-resync-fetch -- npx tsx scripts/resync-upisnik.mts
      - name: Authoritative data must remain unchanged
        if: always()
        run: npx tsx scripts/check-upisnik-readonly.mts
      - name: Preserve evidence and candidate for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upisnik-resync-${{ github.sha }}
          path: .artifacts/upisnik-resync/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
