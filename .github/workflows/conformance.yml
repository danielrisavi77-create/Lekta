# Puna profile-conformance matrica: SVAKI profil registra (fakultet x smjer x vrsta rada)
# dobiva sintetski uskladjen + neuskladjen .docx i asserte izvedene iz vlastitih pravila
# (tests/helpers/conformance.ts). Zaseban workflow jer je ~744 analize (minute) preskupo
# za build gate na svaki commit; u `npm run check` zivi tripwire uzorak (1 profil po
# instituciji). Jedan Node (24): Node-osjetljivost vec pokriva check.yml matrica.
name: conformance

on:
  push:
  pull_request:
  workflow_dispatch:

# Least-privilege token (kao check.yml): samo cita kod.
permissions:
  contents: read

# Jedan aktivan run po grani (audit TEST-18). Bez ovoga vise pusheva u nizu vrti stare i nove
# buildove istovremeno nad istom granom: trose CI minute i, sto je gore, zeleni status starijeg
# commita stigne poslije novijeg pa izgleda kao da je grana ispravna.
# Na master se NE otkazuje: tamo je svaki commit stanje koje mora imati vlastiti dokaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  conformance-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instaliraj ovisnosti
        run: npm ci

      - name: Puna conformance matrica (svi profili)
        run: npm run conformance
