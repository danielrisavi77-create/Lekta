name: Academic object rights metadata inventory

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: OAI-PMH lower date bound (YYYY-MM-DD)
        required: true
        type: string
        default: '2024-01-01'
      max_pages:
        description: Maximum metadata pages per repository
        required: true
        type: choice
        options: ['1', '2', '5']
        default: '1'
      unit_id:
        description: Optional single unitId for a smoke run
        required: false
        type: string
      upload_aggregate_artifact:
        description: Upload aggregate rights report without record identifiers
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate rights inventory tests
        run: |
          python -m unittest discover -s training-pipeline/tests -p 'test_*.py'
          python training-pipeline/scripts/build_academic_repository_registry.py --validate --out "$RUNNER_TEMP/academic-repositories.json"
      - name: Inventory object rights metadata only
        env:
          UNIT_ID: ${{ inputs.unit_id }}
        run: |
          EXTRA=()
          if [ -n "$UNIT_ID" ]; then EXTRA=(--unit "$UNIT_ID"); fi
          python training-pipeline/scripts/inventory_academic_rights.py \
            --from-date "${{ inputs.from_date }}" \
            --max-pages "${{ inputs.max_pages }}" \
            --workers 6 \
            --out "$RUNNER_TEMP/academic-rights-summary.json" \
            --private-candidates-out "$RUNNER_TEMP/academic-rights-candidates.private.jsonl" \
            "${EXTRA[@]}"
      - name: Publish aggregate summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "academic-rights-summary.json").read_text())
          summary = data["summary"]
          print("## Academic object rights metadata inventory")
          print()
          print(f"- Sastavnice: **{summary['units']}**")
          print(f"- Nedostupni repozitoriji: **{summary['repositoriesUnavailable']}**")
          print(f"- Uočeni zapisi radova: **{summary['recordsObserved']}**")
          print(f"- Kandidati s permisivnom licencom: **{summary['permissiveLicenseCandidates']}**")
          print(f"- Uvjetne licence za pregled: **{summary['conditionalLicenseReview']}**")
          print(f"- In copyright za pregled: **{summary['inCopyrightReview']}**")
          print(f"- Bez eksplicitne licence: **{summary['noExplicitLicense']}**")
          print(f"- Nisu open access: **{summary['notOpenAccess']}**")
          print()
          print("Nijedan zapis nije automatski odobren. Privatni PID manifest nije objavljen.")
          PY
      - name: Upload aggregate report
        if: ${{ inputs.upload_aggregate_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: academic-rights-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/academic-rights-summary.json
          retention-days: 7
          if-no-files-found: error
