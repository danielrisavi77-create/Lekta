name: Foundation check

on:
  push:
    branches:
      - architecture/lekta-katedra-foundation-v0.1
  pull_request:
    branches:
      - master

# Jedan aktivan run po grani (audit TEST-18). Bez ovoga vise pusheva u nizu vrti stare i nove
# buildove istovremeno nad istom granom: trose CI minute i, sto je gore, zeleni status starijeg
# commita stigne poslije novijeg pa izgleda kao da je grana ispravna.
# Na master se NE otkazuje: tamo je svaki commit stanje koje mora imati vlastiti dokaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # Od 2026-09-01 je `check:edge` DIO `npm run check`, a taj korak trazi Deno i NAMJERNO pada
      # umjesto da se tiho preskoci. `check.yml` je Deno dobio odmah; ovaj posao nije, i to se nije
      # vidjelo jer se okida SAMO na pull requestu prema masteru, nikad na pushu na master. Master
      # je zato ostao zelen, a svaki PR od tada pada na "deno nije dostupan u PATH-u", sto izgleda
      # kao kvar u PR-u a kvar je u ovom workflowu.
      - name: Deno setup (Edge typecheck je dio gatea)
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - run: npm ci
      - run: npm run check
