# Smoke test: sagradi sintetski .docx i pokazi kako motor reagira (score, provjere, nalazi).
# Ne treba tajne ni bazu: sve je lokalno (analyzeDocx radi u Node preko @xmldom/xmldom, ista
# putanja kao Web Worker). Artefakti (uzorci .docx + analiza-*.json + IZVJESTAJ.md) se uploadaju
# pa se mogu preuzeti iz run-a; IZVJESTAJ.md ide i u sazetak job-a.
name: docx-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

# Least-privilege token (AUD-48): upload-artifact ne treba contents: write.
permissions:
  contents: read

# Jedan aktivan run po grani (audit TEST-18). Bez ovoga vise pusheva u nizu vrti stare i nove
# buildove istovremeno nad istom granom: trose CI minute i, sto je gore, zeleni status starijeg
# commita stigne poslije novijeg pa izgleda kao da je grana ispravna.
# Na master se NE otkazuje: tamo je svaki commit stanje koje mora imati vlastiti dokaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  generate-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instaliraj ovisnosti
        run: npm ci

      - name: Generiraj uzorke .docx i analiziraj
        run: npx vite-node scripts/docx-smoke.mts

      - name: IZVJESTAJ u sazetak job-a
        if: always()
        run: |
          if [ -f artifacts/IZVJESTAJ.md ]; then
            cat artifacts/IZVJESTAJ.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "IZVJESTAJ.md nije generiran (skripta je pala prije zapisa)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artefakte (docx + analiza)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docx-smoke-artifacts
          path: artifacts/
          if-no-files-found: warn
