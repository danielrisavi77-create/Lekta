name: Lekta training pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inventory only or build from rights-approved repositories
        required: true
        type: choice
        options: [inventory, build]
        default: inventory
      profile_id:
        description: Lekta profile ID used in build mode
        required: true
        type: string
        default: fpzg-politologija-diplomski
      convert_pdf:
        description: Create temporary DOCX working copies from text PDFs
        required: true
        type: boolean
        default: false
      upload_sanitized_artifact:
        description: Upload sanitized output after the run
        required: true
        type: boolean
        default: false
      max_documents:
        description: Hard build cap (1-50); inventory always scans all documents
        required: true
        type: choice
        options: ['1', '5', '10', '25', '50']
        default: '10'

permissions:
  contents: read

# Jedan aktivan run po grani (audit TEST-18). Bez ovoga vise pusheva u nizu vrti stare i nove
# buildove istovremeno nad istom granom: trose CI minute i, sto je gore, zeleni status starijeg
# commita stigne poslije novijeg pa izgleda kao da je grana ispravna.
# Na master se NE otkazuje: tamo je svaki commit stanje koje mora imati vlastiti dokaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install project dependencies
        run: |
          npm ci
          python -m pip install -r training-pipeline/requirements.txt
      - name: Test pipeline helpers
        run: |
          python -m unittest discover -s training-pipeline/tests -p 'test_*.py'
          python training-pipeline/scripts/validate_config.py --config training-pipeline/source-repositories.json
      - name: Clone configured source repositories
        env:
          LEKTA_REPOS_TOKEN: ${{ secrets.LEKTA_REPOS_TOKEN }}
        run: |
          python training-pipeline/scripts/clone_sources.py \
            --config training-pipeline/source-repositories.json \
            --out "$RUNNER_TEMP/lekta-sources" \
            --mode "${{ inputs.mode }}" > "$RUNNER_TEMP/sources.json"
      - name: Run inventory or build
        run: |
          ROOTS=$(python -c 'import json; print(" ".join(json.load(open("${{ runner.temp }}/sources.json"))["roots"]))')
          EXTRA=""
          if [ "${{ inputs.convert_pdf }}" = "true" ]; then EXTRA="--convert-pdf"; fi
          python training-pipeline/run_pipeline.py \
            --roots $ROOTS \
            --mode "${{ inputs.mode }}" \
            --profile "${{ inputs.profile_id }}" \
            --max-documents "${{ inputs.max_documents }}" \
            --out-dir "$RUNNER_TEMP/lekta-output" \
            $EXTRA
      - name: Publish sanitized run summary
        run: |
          python training-pipeline/scripts/render_summary.py \
            --input "$RUNNER_TEMP/lekta-output/sanitized/summary.json" \
            --output "$RUNNER_TEMP/lekta-summary.md"
          cat "$RUNNER_TEMP/lekta-summary.md"
          cat "$RUNNER_TEMP/lekta-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized artifact
        if: ${{ inputs.upload_sanitized_artifact }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lekta-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/lekta-output/sanitized/
          retention-days: 7
          if-no-files-found: error
