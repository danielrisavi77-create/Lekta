# Build gate u CI (tvrdo pravilo iz CLAUDE.md: `npm run check` = tsc --noEmit && vitest run && vite build).
# Do sada je jedini workflow bio docx-smoke (ponasanje motora); ovaj cuva da PR ne moze srusiti
# tipove, testove ni build. Bez tajni i baze: analiza radi lokalno (@xmldom/xmldom, ista putanja
# kao Web Worker), pa je gate potpuno reproducibilan na CI-u.
name: check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # DAN-80: GitHub merge queue gradi PR s najnovijim masterom na grani gh-readonly-queue/* i trazi
  # iste provjere pod ovim okidacem; bez njega PR u redu visi bez statusa.
  merge_group:
  workflow_dispatch:

# Least-privilege token (AUD-48): gate nista ne pise, samo cita kod.
permissions:
  contents: read

# Jedan aktivan run po grani (audit TEST-18). Bez ovoga vise pusheva u nizu vrti stare i nove
# buildove istovremeno nad istom granom: trose CI minute i, sto je gore, zeleni status starijeg
# commita stigne poslije novijeg pa izgleda kao da je grana ispravna.
# Na master se NE otkazuje: tamo je svaki commit stanje koje mora imati vlastiti dokaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Matrica (AUD-49): CI je pinao samo Node 20, a developeri rade na Node 24 (lokalni
    # npm run check). Gate sada dokazuje zeleno na obje verzije, ukljucujuci onu koja se
    # stvarno pokrece lokalno.
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # setup-node uz Node 20 trenutno donosi npm 10, ali package.json zakljucava npm 11.11.0.
      # Razlicite npm verzije razlicito tumace opcionalne peer zapise u lockfileu, pa matrica
      # mora prije `npm ci` koristiti isti package manager kojim je lockfile proizveden.
      # `npm-version` je zato ulaz u composite action, ne zaseban korak (mora ici IZMEDJU
      # setup-nodea i `npm ci`, a oba su unutar akcije).
      - name: Ovisnosti (kesirano)
        uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ matrix.node }}
          npm-version: 11.11.0

      # supabase/functions/** je Deno kod izvan tsconfig.json include-a. Od 2026-09-01 je
      # `check:edge` DIO `npm run check`, pa Deno treba OBJEMA granama matrice, prije gatea.
      # Ranije je stajao kao zaseban korak samo na Node 20, pa je lokalni gate tu rupu imao
      # otvorenu: serverski kod koji barata novcem, tudjim dokumentima i pravom pristupa
      # provjeravao se tek nakon pusha.
      - name: Deno setup (Edge typecheck je dio gatea)
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Build gate (oxlint + tsc + edge + vitest + vite build)
        run: npm run check

      # Typecheck Edge funkcija NE dira lockfile (`check-edge.mjs` svakom pozivu Dena predaje
      # `--no-lock`), pa tranzitivni graf koji esm.sh posluzuje nitko nije provjeravao:
      # `deno.lock` je imao JEDAN `remote` unos, a stvarni graf ima 11 (cijelo stablo supabase
      # klijenta plus iceberg-js i tslib). Ovaj korak ih zakljucava i provjerava otiske.
      #
      # `--selftest` je dio koraka, ne ukras: izmjereno je da `deno check --frozen` NE prijavi
      # podmetnut otisak (vraca 0 i uz praznu predmemoriju), pa bi gard oslonjen na njega bio
      # dekorativan. Selftest nad kopijom locka dokazuje da ovaj poziv doista pada.
      - name: Edge lock (tranzitivni graf + dokaz da gard grize)
        run: node scripts/check-edge-lock.mjs --selftest

      # Faza A zastite baze pravila: post-build sken dist artefakata na kanarince i
      # never-markere privatnog sloja (drafts evidence, ledger, source-registry).
      # Vitest sloj (tests/classification.test.ts) cuva manifest i izvore; vite plugin
      # (classification-guard) pada na krivom importu u samom buildu; ovaj korak cuva
      # EMITIRANE datoteke nakon vite builda, ukljucujuci dist-packs/.
      - name: Klasifikacijski sken dist artefakata
        run: node scripts/verify-dist-classification.mjs

  ux-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ovisnosti (kesirano)
        uses: ./.github/actions/setup-deps
        with:
          node-version: 24

      - name: Instaliraj Chromium
        run: npx playwright install --with-deps chromium

      - name: UX viewport gate
        run: npm run test:ux

  # KRITICNI PUT NAD PRODUKCIJSKIM ARTEFAKTOM (vanjski audit 2026-09-08, nalaz 3).
  #
  # `ux-gate` iznad vrti Playwright protiv `npm run dev`; `post-deploy-smoke` nad zivom stranicom nikad
  # ne ucitava dokument. Nista dakle nije vrtjelo dokument -> profil -> nalaz -> popravak nad onim sto
  # se stvarno objavljuje (minificiran bundle, `__DEV_TOOLS__=false`, generirane stranice). Ovaj job
  # gradi ISTIM lancem kao netlify.toml, provjeri dist (bez obaveznog dokaza izdanja: dokaz se pece
  # lokalno jer trazi Word, i to je vec tako), pa vrti `tests/ux-dist/**` kroz `vite preview`.
  dist-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ovisnosti (kesirano)
        uses: ./.github/actions/setup-deps
        with:
          node-version: 24

      - name: Instaliraj Chromium
        run: npx playwright install --with-deps chromium

      - name: Produkcijski build (isti lanac kao netlify.toml)
        # OKOLINA MORA BITI ISTA KAO `[build.environment]` u netlify.toml, inace ovaj job vrti
        # isti lanac pod drugim uvjetima i zeleno ovdje ne znaci zeleno ondje. Gard nad tom
        # jednakoscu: `tests/deploy-runtime-parity.test.ts`.
        env:
          LEKTA_SITE_ORIGIN: https://lekta.hr
          DEPLOY: "1"
        run: node scripts/build-production.mjs --skip-verify

      - name: Provjera dist artefakta
        run: node scripts/verify-deploy-dist.mjs

      - name: Kriticni put nad dist/ (vite preview)
        run: npm run test:ux:dist

  # T56: mrtvi kod i duplikati kao MJERENJE. Job samo izvjestava (knip + jscpd u job summary i kao
  # artefakt); nije u popisu obveznih provjera i ne smije se tamo dodati. Ratchet koji smije oboriti
  # gate je `tests/lean-ratchet.test.ts` unutar `npm run check`, ne ovaj job.
  lean-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ovisnosti (kesirano)
        uses: ./.github/actions/setup-deps
        with:
          node-version: 24

      - name: Lean izvjestaj (knip + jscpd)
        run: npm run lean:report

      - name: Sazetak u job summary
        if: always()
        run: |
          if [ -f docs/generated/LEAN_REPORT.md ]; then cat docs/generated/LEAN_REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
          npm run --silent lean:report -- --check >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Artefakt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lean-report
          path: docs/generated/LEAN_REPORT.md
          if-no-files-found: ignore

  # DAN-80: MJERENJE shardiranog vitesta, NE zamjena za `build-gate` (on ostaje puni
  # `npm run check`; njegov oblik pinaju tests/check-workflow-package-manager.test.ts i
  # tests/ci-workflow-triggers.test.ts). Job dokazuje dvije stvari prije nego se build-gate smije
  # rezati: (1) zbroj datoteka preko shardova jednak je punom runu (broj u job summaryju svakog sharda),
  # (2) stvarno vrijeme zida po shardu. Nije u popisu obveznih provjera.
  vitest-shard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ovisnosti (kesirano)
        uses: ./.github/actions/setup-deps
        with:
          node-version: 24
          npm-version: 11.11.0

      - name: Vitest shard ${{ matrix.shard }}/4
        run: |
          node scripts/clean-vitest-tmp.mjs
          npx vitest run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile.json=shard.json

      # `vitest list --shard` IGNORIRA shard (izmjereno: svaki shard vrati svih 719 datoteka), pa se
      # particija ne moze dokazati popisom. Dokaz je ovaj broj: zbroj preko 4 shardova mora biti
      # jednak `Test Files` punog runa (719 na 2026-10-08), sto se cita iz job summaryja.
      - name: Broj datoteka u shardu
        if: always()
        run: |
          node -e "const r=JSON.parse(require('fs').readFileSync('shard.json','utf8'));console.log('shard ${{ matrix.shard }}/4 datoteka: '+r.testResults.length)" | tee -a "$GITHUB_STEP_SUMMARY"
