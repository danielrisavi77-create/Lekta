# Build gate u CI (tvrdo pravilo iz CLAUDE.md: `npm run check` = tsc --noEmit && vitest run && vite build).
# Do sada je jedini workflow bio docx-smoke (ponasanje motora); ovaj cuva da PR ne moze srusiti
# tipove, testove ni build. Bez tajni i baze: analiza radi lokalno (@xmldom/xmldom, ista putanja
# kao Web Worker), pa je gate potpuno reproducibilan na CI-u.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

# Least-privilege token (AUD-48): gate nista ne pise, samo cita kod.
permissions:
  contents: read

# Jedan aktivan run po grani (audit TEST-18). Bez ovoga vise pusheva u nizu vrti stare i nove
# buildove istovremeno nad istom granom: trose CI minute i, sto je gore, zeleni status starijeg
# commita stigne poslije novijeg pa izgleda kao da je grana ispravna.
# Na master se NE otkazuje: tamo je svaki commit stanje koje mora imati vlastiti dokaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Matrica (AUD-49): CI je pinao samo Node 20, a developeri rade na Node 24 (lokalni
    # npm run check). Gate sada dokazuje zeleno na obje verzije, ukljucujuci onu koja se
    # stvarno pokrece lokalno.
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # supabase/functions/** je Deno kod izvan tsconfig.json include-a. Od 2026-09-01 je
      # `check:edge` DIO `npm run check`, pa Deno treba OBJEMA granama matrice, prije gatea.
      # Ranije je stajao kao zaseban korak samo na Node 20, pa je lokalni gate tu rupu imao
      # otvorenu: serverski kod koji barata novcem, tudjim dokumentima i pravom pristupa
      # provjeravao se tek nakon pusha.
      - name: Deno setup (Edge typecheck je dio gatea)
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Instaliraj ovisnosti
        run: npm ci

      - name: Build gate (oxlint + tsc + edge + vitest + vite build)
        run: npm run check

      # Faza A zastite baze pravila: post-build sken dist artefakata na kanarince i
      # never-markere privatnog sloja (drafts evidence, ledger, source-registry).
      # Vitest sloj (tests/classification.test.ts) cuva manifest i izvore; vite plugin
      # (classification-guard) pada na krivom importu u samom buildu; ovaj korak cuva
      # EMITIRANE datoteke nakon vite builda, ukljucujuci dist-packs/.
      - name: Klasifikacijski sken dist artefakata
        run: node scripts/verify-dist-classification.mjs

  ux-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Instaliraj ovisnosti
        run: npm ci

      - name: Instaliraj Chromium
        run: npx playwright install --with-deps chromium

      - name: UX viewport gate
        run: npm run test:ux
