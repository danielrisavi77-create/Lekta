# Build gate u CI (tvrdo pravilo iz CLAUDE.md: `npm run check` = tsc --noEmit && vitest run && vite build).
# Do sada je jedini workflow bio docx-smoke (ponasanje motora); ovaj cuva da PR ne moze srusiti
# tipove, testove ni build. Bez tajni i baze: analiza radi lokalno (@xmldom/xmldom, ista putanja
# kao Web Worker), pa je gate potpuno reproducibilan na CI-u.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

# Least-privilege token (AUD-48): gate nista ne pise, samo cita kod.
permissions:
  contents: read

# Jedan aktivan run po grani (audit TEST-18). Bez ovoga vise pusheva u nizu vrti stare i nove
# buildove istovremeno nad istom granom: trose CI minute i, sto je gore, zeleni status starijeg
# commita stigne poslije novijeg pa izgleda kao da je grana ispravna.
# Na master se NE otkazuje: tamo je svaki commit stanje koje mora imati vlastiti dokaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Matrica (AUD-49): CI je pinao samo Node 20, a developeri rade na Node 24 (lokalni
    # npm run check). Gate sada dokazuje zeleno na obje verzije, ukljucujuci onu koja se
    # stvarno pokrece lokalno.
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instaliraj ovisnosti
        run: npm ci

      - name: Build gate (tsc + vitest + vite build)
        run: npm run check

      # supabase/functions/** je Deno kod izvan tsconfig.json include-a, pa ga `npm run check`
      # NIKAD nije provjeravao (audit TEST-01). Ondje zivi serverski kod koji barata novcem,
      # tudjim dokumentima i pravom pristupa, dakle najgore moguce mjesto za rupu u provjeri.
      # Vrti se samo na jednoj Node verziji: rezultat ne ovisi o Nodeu nego o Denu.
      - name: Deno setup (za Edge typecheck)
        if: matrix.node == 20
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge typecheck (deno check nad supabase/functions)
        if: matrix.node == 20
        run: npm run check:edge

  ux-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instaliraj ovisnosti
        run: npm ci

      - name: Instaliraj Chromium
        run: npx playwright install --with-deps chromium

      - name: UX viewport gate
        run: npm run test:ux
