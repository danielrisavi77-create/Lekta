# Testovi autonomnog kontrolera (scripts/autonomy/**, Python stdlib, bez mreze i bez modela).
#
# Zaseban od check.yml NAMJERNO, iz istog razloga kao docx-strict-open i rule-claims: python ovisnost
# ne smije uci u tvrdi build gate (`npm run check`). Ovo je ipak OBVEZNA provjera za PR koji dira
# kontroler ili njegove upute: vlasnik je dodaje u required checkove grane master, pa buduci PR ne moze
# preskociti njezino izvrsenje (plan autonomije, "Pravilo zatvaranja svakog zadatka").
#
# Standardni runner javnog repozitorija: 0 USD dodatne naplate. Bez artefakata, bez cachea.
name: autonomy-tests

# BEZ path filtera, namjerno: ovo je OBVEZNA provjera grane master (`unittest (3.12)`), a obvezna provjera
# koja se na nekom PR-u uopce ne okine ostavlja taj PR trajno blokiranim. Posao traje oko minutu na
# standardnom runneru javnog repozitorija, pa je cijena svakog PR-a 0 USD i minuta.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      # Node treba samo jednom testu koji stvarno zove scripts/agents/cli.mjs prepare (bez modela).
      - name: Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Autonomy unittest (bez mreze, bez modela, bez tajni)
        env:
          ANTHROPIC_API_KEY: ''
          OPENAI_API_KEY: ''
        run: python -m unittest discover -s scripts/autonomy/tests -t . -p 'test_*.py' -v
