name: repair-slow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instaliraj ovisnosti
        run: npm ci

      - name: Closed-loop repair matrica
        run: npm run test:slow
