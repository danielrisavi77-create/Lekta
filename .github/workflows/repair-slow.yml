name: repair-slow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Jedan aktivan run po grani (audit TEST-18). Bez ovoga vise pusheva u nizu vrti stare i nove
# buildove istovremeno nad istom granom: trose CI minute i, sto je gore, zeleni status starijeg
# commita stigne poslije novijeg pa izgleda kao da je grana ispravna.
# Na master se NE otkazuje: tamo je svaki commit stanje koje mora imati vlastiti dokaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  closed-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ovisnosti (kesirano)
        uses: ./.github/actions/setup-deps
        with:
          node-version: 24

      - name: Closed-loop repair matrica
        run: npm run test:slow
