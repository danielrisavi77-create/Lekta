# Smoke nad SQL-om koji brani kvote i pristup (audit P1-05).
#
# Zaseban od `Academic Suite DB` namjerno: onaj posao ima `if:` vezan uz JEDNU granu
# (`architecture/lekta-katedra-foundation-v0.1`), pa se na svim ostalim PR-ovima prijavljuje kao
# `skipped`. Provjera koja se na tvom PR-u preskoci ne stiti tvoj PR.
#
# Ovdje se vrti plpgsql logika koju vitest ne moze dokazati jer ne postoji izvan baze: atomicnost,
# row lock i kompenzacija. Smoke datoteke same zovu `\i supabase/migrations/...`, pa testiraju
# STVARNU migraciju, ne svoju kopiju.
name: db-smoke

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  db-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # BEZ service kontejnera (odluka vlasnika 2026-11-21). I Docker Hub i AWS zrcalo
    # (public.ecr.aws) rusili su oko 27 % runova na `toomanyrequests` pri dohvatu slike, prije
    # ijednog testa. ubuntu-latest vec ima instaliran PostgreSQL; ovdje se samo pokrene. Lozinke i
    # dalje nema, namjerno: `trust` samo za lokalne veze baze koja zivi nekoliko minuta u ovom poslu.
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pokreni PostgreSQL s runnera (bez dohvata Docker slike)
        run: |
          sudo sed -i -E 's/(scram-sha-256|md5|peer)$/trust/' /etc/postgresql/*/main/pg_hba.conf
          sudo systemctl start postgresql.service
          for i in $(seq 1 20); do pg_isready -h 127.0.0.1 -U postgres -d postgres && break; sleep 1; done
          pg_isready -h 127.0.0.1 -U postgres -d postgres

      - name: PostgreSQL verzija
        run: psql --version && psql -tAc 'select version()'

      # Prvo se dokazuje da provjera GRIZE, pa tek onda da migracija prolazi. Bez ovog koraka
      # zeleni smoke ne razlikuje "kompenzacija radi" od "smoke ne mjeri kompenzaciju".
      - name: Mutacija mora srusiti smoke (dokaz da gate grize)
        run: bash scripts/rate-slots-mutation-check.sh

      - name: Rate-limit slotovi (P1-05)
        run: psql -v ON_ERROR_STOP=1 -f scripts/rate-slots-smoke.sql

      - name: Garancijski dokaz (P1-09)
        run: psql -v ON_ERROR_STOP=1 -f scripts/guarantee-evidence-smoke.sql

      - name: Stanje brisanja popravka (P1-10)
        run: psql -v ON_ERROR_STOP=1 -f scripts/repair-deletion-smoke.sql

      - name: Ciscenje anonimnih racuna (P1-11)
        run: psql -v ON_ERROR_STOP=1 -f scripts/anon-purge-smoke.sql

      - name: Outbox bonus obveza (P1-07)
        run: psql -v ON_ERROR_STOP=1 -f scripts/bonus-outbox-smoke.sql

      - name: Sabirnica klijentskih gresaka (P1-28)
        run: psql -v ON_ERROR_STOP=1 -f scripts/client-errors-smoke.sql

      - name: Mutacije 0209 moraju srusiti smoke (T84 RD-3, prava, retencija)
        run: bash scripts/repair-slot-per-user-mutation-check.sh

      - name: Slot popravka po korisniku i statusi bez potrosnje (T84 RD-3, RD-2)
        run: psql -v ON_ERROR_STOP=1 -f scripts/repair-slot-per-user-smoke.sql
