# Objava jednim gumbom: klijent (Netlify) i Edge funkcije iz istog commita, zajedno.
#
# ZASTO. Klijent i `repair-docx` / `create-checkout` dijele ugovor o privoli (termsVersion). Kad
# klijent ode van bez tih funkcija, server odbija upload i kupnju s `400 consent_required`
# (docs/GO_LIVE_REPAIR.md). Do sada su se objavljivali odvojeno i rucno, pa je taj raskorak bio
# pitanje discipline. Ovdje je redoslijed zapisan i cuva ga tests/release-workflow.test.ts.
#
# REDOSLIJED U SVAKOJ OKOLINI, i svaki korak pada prije sljedeceg:
#   1. commit je na masteru (nikad grana, nikad necommitano stablo);
#   2. build klijenta, PRIJE ikakvog deploya: pad builda ne ostavlja nista napola objavljeno;
#   3. samo na stagingu `supabase db push`; zatim provjera da su migracije koje funkcije trebaju
#      primijenjene na ciljnom projektu (samo citanje, i u produkciji);
#   4. klijent se UCITA na Netlify kao neobjavljen deploy (spori dio koji moze pasti), zatim Edge
#      funkcije, pa se vec ucitan deploy objavi jednim API pozivom (Codex na #339: pad uploada
#      poslije Edgea ostavio bi nove funkcije uz stari klijent). Prozor raskoraka je jedan poziv;
#   5. smoke nad zivom instalacijom uz --strict-commit: objavljeno je bas ovo izdanje.
#
# POKRECE SAMO VLASNIK. Staging nema required reviewera (staging bez klika, odluka vlasnika), pa
# job-level `if` dopusta samo vlasnikov dispatch i re-run; svaki drugi pokretac preskace oba joba
# prije nego runner vidi ijednu tajnu (Codex na #339).
#
# STAGING PRVI, PRODUKCIJA IZA ODOBRENJA. Job `production` ovisi o zelenom `staging` jobu i trazi
# GitHub environment `production`, ciji required reviewer (vlasnik) mora kliknuti Approve. Bez
# tog klika nista ne ide u produkciju. Tajne i refovi su po environmentu, pa staging job ne vidi
# produkcijski token. Popis postavki: docs/deploy/OBJAVA_JEDNIM_GUMBOM.md.
#
# STO OVAJ WORKFLOW NAMJERNO NE RADI: ne primjenjuje migracije na produkciju (`supabase db push`
# na produkciji ostaje vlasnikov rucni korak, supabase/CLAUDE.md), ne mijenja tajne i ne dira
# Supabase ni Netlify postavke.
name: release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Tocan commit mastera koji se objavljuje (40 znakova)'
        required: true
      functions:
        description: 'Edge funkcije koje idu uz klijent (razmakom odvojene)'
        required: true
        default: 'repair-docx create-checkout'
      migrations:
        description: 'Migracije koje moraju biti primijenjene na cilju prije deploya funkcija'
        required: true
        default: '0207_monetizacija_v1 0209_repair_limit_po_korisniku'

permissions:
  contents: read

# Jedna objava odjednom, i nikad otkazana usred: napola objavljen par je upravo kvar koji
# ovaj workflow postoji sprijeciti.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  staging:
    if: github.actor == 'danielrisavi77-create' && github.triggering_actor == 'danielrisavi77-create'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      RELEASE_TARGET: staging
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      RELEASE_SHA: ${{ inputs.sha }}
      RELEASE_FUNCTIONS: ${{ inputs.functions }}
      RELEASE_MIGRATIONS: ${{ inputs.migrations }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout trazenog commita
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Prije IJEDNOG koda iz checkouta (Codex na #339): commit s grane bi mogao zamijeniti i samu
      # skriptu provjere. Ovdje rade samo git i ljuska runnera.
      - name: Commit na masteru (prije koda iz checkouta)
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha nije 40-znamenkasti commit malim slovima"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "checkoutan nije trazeni commit"; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SHA" origin/master || { echo "commit nije na origin/master"; exit 1; }

      - name: Ulazi i commit na masteru
        run: node scripts/release-inputs.mjs

      - name: Ovisnosti
        uses: ./.github/actions/setup-deps
        with:
          node-version: '24'
          npm-version: 11.11.0

      # Netlify CLI se razrjesava i instalira OVDJE, bez ijedne tajne u okolini (Codex na #339).
      # Kasniji koraci s tokenom koriste vec instaliran paket iz npx cachea, pa se instalacijske
      # skripte tranzitivnih ovisnosti ne vrte uz NETLIFY_AUTH_TOKEN.
      - name: Netlify CLI (instalacija bez tajni)
        run: npx --yes netlify-cli@27.10.2 --version

      # Staging build NE trazi dokaz izdanja: dokaz (Tier 2) se pece upravo nad stagingom
      # (LEKTA_STAGING_ORIGIN u release:check), pa bi tvrdi gate ovdje bio koka i jaje.
      - name: Build klijenta (staging)
        env:
          DEPLOY: '1'
          LEKTA_REQUIRE_RELEASE_PROOF: '0'
          LEKTA_SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          VITE_LEKTA_ENV: staging
          VITE_LEKTA_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_LEKTA_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: node scripts/build-production.mjs

      # SAMO STAGING (odluka vlasnika 2026-10-08: staging bez njegovog racunala). Isti put kao
      # rucni val 0 iz docs/deploy/EDGE_DEPLOY_T20.md: iskljucivo `supabase db push`, nikad MCP
      # apply_migration. Prvo suhi prolaz u log, pa stvarni. Produkcijske migracije ostaju
      # vlasnikov rucni korak; gard obara `db push` u produkcijskom jobu.
      - name: Migracije na staging (db push)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Katedrine verzije 0104 do 0199 postoje samo u bazi; release-staging-history.mjs za njih pise
        # privremene placeholdere u checkout runnera (docs/deploy/KANAL_A_UKLJUCIVANJE.md), a sve
        # drugo neuskladeno obara job. `--include-all` jer neprimijenjena migracija smije biti starija od zadnje primijenjene.
        run: |
          node scripts/release-staging-history.mjs --ref "$PROJECT_REF"
          npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Migracije primijenjene na cilju
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/release-migration-check.mjs --ref "$PROJECT_REF" --migrations "$RELEASE_MIGRATIONS"

      - name: Klijent ucitan (neobjavljen)
        id: upload
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli@27.10.2 deploy --dir dist --no-build --site "$NETLIFY_SITE_ID" --message "release $RELEASE_SHA" --json > "$RUNNER_TEMP/netlify-deploy.json"
          deploy_id="$(jq -er '.deploy_id' "$RUNNER_TEMP/netlify-deploy.json")"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Edge funkcije
        id: edge
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions deploy $RELEASE_FUNCTIONS --project-ref "$PROJECT_REF" --use-api

      # Objava vec ucitanog deploya (isto sto i "Publish deploy" u Netlify sucelju); radi i kad je
      # auto publishing zakljucan.
      - name: Klijent objavljen
        id: objava
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          DEPLOY_ID: ${{ steps.upload.outputs.deploy_id }}
        run: npx --yes netlify-cli@27.10.2 api restoreSiteDeploy --data "{\"site_id\":\"$NETLIFY_SITE_ID\",\"deploy_id\":\"$DEPLOY_ID\"}"

      - name: Smoke nad stagingom
        run: >-
          node scripts/post-deploy-smoke.mjs --site "$SITE_ORIGIN"
          --functions "https://$PROJECT_REF.supabase.co/functions/v1"
          --require-build-info --expect-commit "$RELEASE_SHA" --strict-commit

      # Pad ili prekid nakon pocetka Edge deploya, a prije objave klijenta, vraca funkcije na commit zivog
      # klijenta (Codex na #339): deploy vise funkcija nije transakcija, a ni objava ne smije pasti
      # uz vec nove funkcije.
      - name: Povrat Edge funkcija (samo nakon pada)
        if: (failure() || cancelled()) && steps.edge.outcome != 'skipped' && steps.objava.outcome != 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/release-edge-rollback.mjs

  production:
    needs: staging
    if: github.actor == 'danielrisavi77-create' && github.triggering_actor == 'danielrisavi77-create'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      RELEASE_TARGET: production
      RELEASE_SHA: ${{ inputs.sha }}
      RELEASE_FUNCTIONS: ${{ inputs.functions }}
      RELEASE_MIGRATIONS: ${{ inputs.migrations }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout trazenog commita
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Prije IJEDNOG koda iz checkouta (Codex na #339): commit s grane bi mogao zamijeniti i samu
      # skriptu provjere. Ovdje rade samo git i ljuska runnera.
      - name: Commit na masteru (prije koda iz checkouta)
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha nije 40-znamenkasti commit malim slovima"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "checkoutan nije trazeni commit"; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SHA" origin/master || { echo "commit nije na origin/master"; exit 1; }

      - name: Ulazi i commit na masteru
        run: node scripts/release-inputs.mjs

      - name: Ovisnosti
        uses: ./.github/actions/setup-deps
        with:
          node-version: '24'
          npm-version: 11.11.0

      # Netlify CLI se razrjesava i instalira OVDJE, bez ijedne tajne u okolini (Codex na #339).
      # Kasniji koraci s tokenom koriste vec instaliran paket iz npx cachea, pa se instalacijske
      # skripte tranzitivnih ovisnosti ne vrte uz NETLIFY_AUTH_TOKEN.
      - name: Netlify CLI (instalacija bez tajni)
        run: npx --yes netlify-cli@27.10.2 --version

      # Isti lanac i iste zastavice kao netlify.toml: tvrdi dokaz izdanja (audit P0-03). Bez
      # svjezeg docs/generated/RELEASE_PROOF.json za ovo stablo build pada i nista ne ide van.
      # VITE_LEKTA_SUPABASE_* se namjerno ne postavljaju: produkcija koristi kanonske vrijednosti
      # iz src/config/deployment.ts, isto kao Netlify build.
      - name: Build klijenta (produkcija)
        env:
          DEPLOY: '1'
          LEKTA_REQUIRE_RELEASE_PROOF: '1'
          LEKTA_SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          VITE_LEKTA_ENV: production
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: node scripts/build-production.mjs

      - name: Migracije primijenjene na cilju
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/release-migration-check.mjs --ref "$PROJECT_REF" --migrations "$RELEASE_MIGRATIONS"

      - name: Klijent ucitan (neobjavljen)
        id: upload
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli@27.10.2 deploy --dir dist --no-build --site "$NETLIFY_SITE_ID" --message "release $RELEASE_SHA" --json > "$RUNNER_TEMP/netlify-deploy.json"
          deploy_id="$(jq -er '.deploy_id' "$RUNNER_TEMP/netlify-deploy.json")"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Edge funkcije
        id: edge
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions deploy $RELEASE_FUNCTIONS --project-ref "$PROJECT_REF" --use-api

      # Objava vec ucitanog deploya (isto sto i "Publish deploy" u Netlify sucelju); radi i kad je
      # auto publishing zakljucan.
      - name: Klijent objavljen
        id: objava
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          DEPLOY_ID: ${{ steps.upload.outputs.deploy_id }}
        run: npx --yes netlify-cli@27.10.2 api restoreSiteDeploy --data "{\"site_id\":\"$NETLIFY_SITE_ID\",\"deploy_id\":\"$DEPLOY_ID\"}"

      - name: Smoke nad produkcijom
        run: >-
          node scripts/post-deploy-smoke.mjs --site "$SITE_ORIGIN"
          --functions "https://$PROJECT_REF.supabase.co/functions/v1"
          --require-build-info --expect-commit "$RELEASE_SHA" --strict-commit

      # Pad ili prekid nakon pocetka Edge deploya, a prije objave klijenta, vraca funkcije na commit zivog
      # klijenta (Codex na #339): deploy vise funkcija nije transakcija, a ni objava ne smije pasti
      # uz vec nove funkcije.
      - name: Povrat Edge funkcija (samo nakon pada)
        if: (failure() || cancelled()) && steps.edge.outcome != 'skipped' && steps.objava.outcome != 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/release-edge-rollback.mjs
