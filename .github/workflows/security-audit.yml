# Supply-chain provjera (BL-P3-14): revizija PRODUKCIJSKIH ovisnosti + skeniranje tajni.
# Dev CLI-jevi (netlify-cli, supabase) dominiraju lockfileom pa ih namjerno izostavljamo
# (--omit=dev); ono sto zavrsi u browser bundleu mora biti bez high/critical ranjivosti.
# Tjedni cron hvata novoobjavljene ranjivosti i bez novog commita.
# gitleaks job (AUD-47 / LEKTA-SEC-07): dosad je jedini security korak bio npm audit (samo CVE
# ovisnosti); commitirana tajna ne bi bila uhvacena. gitleaks skenira kod i git povijest.
name: security-audit

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # ponedjeljak 06:00 UTC

# Least-privilege token (AUD-48): ovi jobovi nista ne pisu, samo citaju kod.
permissions:
  contents: read

# Jedan aktivan run po grani (audit TEST-18). Bez ovoga vise pusheva u nizu vrti stare i nove
# buildove istovremeno nad istom granom: trose CI minute i, sto je gore, zeleni status starijeg
# commita stigne poslije novijeg pa izgleda kao da je grana ispravna.
# Na master se NE otkazuje: tamo je svaki commit stanje koje mora imati vlastiti dokaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instaliraj ovisnosti
        run: npm ci

      - name: Audit produkcijskih ovisnosti (high+)
        run: npm audit --omit=dev --audit-level=high

      # PUN GRAF, UKLJUCUJUCI BUILD ALATE (audit P1-21).
      #
      # Korak iznad gleda samo ono sto zavrsi u browser bundleu. Ali build i CI izvrsavaju desetke
      # dev alata nad ovim kodom i nad artefaktom koji se deploya: kompromitiran test runner ili
      # bundler utjece na ono sto se objavi jednako kao i runtime ovisnost. Do sada taj graf nitko
      # nije ni mjerio.
      #
      # RATCHET, ne tvrdi gate, i ne vise samo ispis (vanjski audit 2026-09-08, nalaz 6). Do
      # 2026-09-09 ovaj je korak imao `continue-on-error` i broj samo ISPISIVAO, pa je rast bio
      # nevidljiv: komentar ovdje tvrdio je 21 (mjereno 2026-08-24), a stvarno je bilo 23. Strop
      # zivi u `data/security/npm-audit-ratchet.json` i smije samo PADATI: iznad stropa korak pada,
      # ispod stropa javlja `::notice` da se strop spusti, jednako je tiho OK. Tvrdi gate na nuli
      # bi i dalje bio greska: svih 23 su tranzitivni pod `netlify-cli` i `vitest`/`vite` i ne
      # daju se popraviti bez odluke o nadogradnji tih alata, pa bi trajno crven CI naucio sve da
      # ga ignoriraju. Selftest prije mjerenja dokazuje da gard grize (podmetnut porast mora pasti).
      - name: Audit punog grafa (ratchet, selftest pa mjerenje)
        run: |
          echo "::group::Pun dependency graf (runtime + build)"
          npm audit --audit-level=high || true
          echo "::endgroup::"
          node scripts/npm-audit-ratchet.mjs --selftest
          node scripts/npm-audit-ratchet.mjs

      # SBOM (audit P1-21). Popis svega sto je stvarno instalirano, vezan uz commit, da se poslije
      # moze odgovoriti "je li ta ranjiva verzija bila u ovom buildu" bez pogadjanja.
      - name: SBOM
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom-runtime.json || npm ls --all --json > sbom-runtime.json

      - name: Spremi SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom-runtime.json
          if-no-files-found: warn

  gitleaks:
    name: Skeniranje tajni (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (puna povijest za skeniranje svih commitova)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Binarij se provjerava po SHA256 PRIJE raspakiranja (audit TEST-15). Dosad se preuzimao i
      # instalirao bez ijedne provjere integriteta, pa bi izmijenjen artefakt tiho dobio pravo
      # izvrsavanja u CI-ju, i to u jobu koji postoji zbog sigurnosti.
      #
      # Sto ovo JEST: obrana od izmijenjenog ili okrnjenog preuzimanja i od podmetanja u prijenosu.
      # Sto NIJE: obrana od kompromitiranog samog releasea (hash je iz istog izvora kao binarij).
      # Za to bi trebao potpis, koji gitleaks release ne nudi; zato je hash UPISAN ovdje, a ne
      # dohvacen s interneta uz binarij: promjena upstreama tada mora proci kroz pregled ovog fajla.
      - name: Instaliraj gitleaks (pinana verzija + provjera SHA256)
        run: |
          VER=8.18.4
          SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Pripremi gitleaks konfiguraciju (allowlist za vec prihvacene javne artefakte)
        run: |
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'GITLEAKS_TOML'
          # Prosiruje ugradjena gitleaks pravila; allowlist samo za PO ODLUCI javne artefakte.
          [extend]
          useDefault = true
          [allowlist]
          description = "Javni Supabase anon kljuc, benigni browser storage identifikator i harvestirani provenijencijski HTML"
          regexTarget = "match"
          # Tocan anon JWT iz src/ui/app.ts (role: anon, ovaj projekt). Payload segment enkodira
          # role/ref/iat/exp; service-role kljuc ima drugaciji payload pa i dalje PADA (nije allowlistan).
          # Drugi regex je doslovni sessionStorage naziv Katedra handoffa. Nije vjerodajnica;
          # generic-api-key ga je u jednom povijesnom commitu lazno označio zbog naziva *_KEY.
          regexes = [
          '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpycmp0dGl6anlmY3htY3Bnem1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1ODIzMTcsImV4cCI6MjA5OTE1ODMxN30\.[A-Za-z0-9_-]+''',
          '''lekta\.katedra-handoff-result\.v0\.1''',
          # Naziv TESTNOG kljuca iz repair-contract-v1 fixtura (grana feature/repair-contract-v1).
          # `keyId` je IDENTIFIKATOR kljuca, ne kljuc: doslovna vrijednost je "fixture-2026-08-16",
          # dakle datum u imenu testnog artefakta. Pripadni `value` je ECDSA POTPIS, izlaz
          # potpisivanja koji je javan po prirodi, a ne privatni kljuc.
          #
          # Allowlista je namjerno na TOM LITERALU, ne na putanjama tih datoteka: da je po putanji,
          # prava tajna naknadno zalijepljena u isti dokument prosla bi neopazeno.
          '''fixture-2026-08-16''',
          # ECDSA P-256 JAVNI kljuc iz repair-contract-v1 fixtura, u SPKI DER obliku (base64url).
          # Prefiks `MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE` je doslovno ASN.1 zaglavlje SPKI
          # strukture za P-256, dakle format koji po definiciji nosi JAVNI dio para; privatni
          # kljuc ima drugaciji ASN.1 omot (PKCS#8, `MIGHAgEAMBMGByqGSM49...`) pa i dalje PADA.
          # generic-api-key ga hvata samo po entropiji (5.42), ne po znacenju.
          #
          # Zasto uopce treba: gitleaks po defaultu skenira SVE refove, ne samo HEAD, pa nalaz
          # dolazi iz grane `feature/repair-contract-v1` i ostaje crven i nakon sto te datoteke
          # na ovoj grani ne postoje. Allowlista je na LITERALU, ne na putanji, iz istog razloga
          # kao gore: putanja bi propustila pravu tajnu naknadno zalijepljenu u istu datoteku.
          '''MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEDyEWJEJSXAqK52WXld1o0CQBkIfLxYnTpPqdgoJ9fUdmbEbTCS6pEuBYSK-6nyGsyygNYwDAtSODs-MSSzQCHA''',
          ]
          # Harvestirani sluzbeni izvori (HTML snapshoti) mogu nositi benigne eyJ/base64 blobove.
          # Lockfile nosi integritetske hasheve, ne aplikacijske tajne.
          #
          # `deno.lock` dodan 2026-09-04. Blok `remote` preslikava JAVNI URL modula u SHA-256 tog
          # modula; `generic-api-key` zagrize na 64 heksadecimalna znaka uz kljuc koji sadrzi "auth"
          # (`https://esm.sh/@supabase/auth-js@.../auth-js.mjs`). Nema vjerodajnice i nema sto
          # rotirati. Provjereno u samoj datoteci, ne po tudjoj rijeci.
          #
          # PUTANJA, a ne fingerprint, i to je ista odluka kao za `package-lock.json`: svaki sljedeci
          # lock donosi nove hasheve, pa bi fingerprint iz `.gitleaksignore` pao vec pri prvom
          # osvjezavanju ovisnosti. Politika "literal, ne putanja" iz allowlista IZNAD vrijedi za
          # fixture literale; za lockfileove je odluka vec bila donesena i zapisana ovdje.
          paths = [
          '''data/sources/.*\.html$''',
          '''(^|/)package-lock\.json$''',
          '''(^|/)deno\.lock$''',
          ]
          GITLEAKS_TOML
          cat "$RUNNER_TEMP/gitleaks.toml"

      - name: Skeniraj repo i git povijest za tajnama
        run: gitleaks detect --source . --config "$RUNNER_TEMP/gitleaks.toml" --redact --verbose --exit-code 1
