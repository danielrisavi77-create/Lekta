# Ponovno iskoristiv korak za jobove koji trebaju node_modules (BL-P3-XX, CI kesiranje).
#
# `actions/setup-node` s `cache: npm` kesira SAMO `~/.npm` (preuzete tarballove), ne
# `node_modules`, pa `npm ci` svaki put ponovno raspakira i linkira cijelo stablo. Ovaj
# composite action kesira SAM `node_modules` po hashu `package-lock.json` (+ OS + Node
# verzija) i `npm ci` pokrece SAMO kad kes promasi.
#
# `npm-version` je opcionalan: `check.yml` build-gate matrica na Node 20 dobiva npm 10 iz
# setup-nodea, a `package.json` zakljucava npm 11.11.0 (razlicite npm verzije razlicito
# tumace opcionalne peer zapise u lockfileu). Taj korak MORA ici izmedju setup-nodea i
# `npm ci`, pa je dio ovog akcije, ne odvojen korak u pozivajucem jobu.
name: 'Setup deps (kesiran node_modules)'
description: 'actions/setup-node + kes node_modules po lockfile hashu; npm ci samo na promasaj'

inputs:
  node-version:
    description: 'Node.js verzija za actions/setup-node'
    required: true
  npm-version:
    description: 'Ako je postavljeno, prisilno instalira ovu tocnu npm verziju prije npm ci'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Node ${{ inputs.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: npm iz packageManager polja
      if: inputs.npm-version != ''
      shell: bash
      run: npm install --global npm@${{ inputs.npm-version }}

    - name: 'Kes node_modules (kljuc: OS + Node + package-lock.json hash)'
      id: cache-node-modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
        # BEZ prefiksa lockfilea: dopusta djelomican pogodak (starije node_modules stablo)
        # kad lockfile promijeni sadrzaj ali OS i Node verzija ostanu isti. `npm ci` ispod
        # svejedno pokriva razliku jer se pokrece na svaki promasaj TOCNOG kljuca.
        restore-keys: |
          node-modules-${{ runner.os }}-node${{ inputs.node-version }}-
          node-modules-${{ runner.os }}-

    - name: Instaliraj ovisnosti (npm ci, samo na promasaj kesa)
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
