<!-- @dsCard group="Tokeni" viewport="900x560" name="Sjene i pokret" subtitle="Pet razina sjene, tri trajanja, dvije krivulje, razmaci 4 do 48" -->
<!doctype html><html lang="hr"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#1C1915;color:#EDE7DC;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.04em}.w{padding:32px;display:grid;gap:32px}.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px}.sw{display:grid;gap:10px}.b{height:72px;background:#F7F3E8}.b.o{background:#2A2620}.l{color:rgba(237,231,220,.65)}h2{margin:0;font:400 24px/1 'Instrument Serif',serif;letter-spacing:0}.m{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.track{position:relative;height:36px;border-bottom:1px solid rgba(237,231,220,.16)}.dot{position:absolute;left:0;top:10px;width:16px;height:16px;border-radius:50%;background:#E4573D;animation:mv 2.4s infinite alternate}@keyframes mv{to{transform:translateX(220px)}}.g{display:flex;align-items:end;gap:16px}.g span{display:grid;gap:6px;justify-items:center}.g i{display:block;background:#E4573D;height:12px}@media (prefers-reduced-motion:reduce){.dot{animation:none}}</style></head><body><div class="w">
<div class="sw"><h2>Sjene po razini</h2><div class="row">
<div class="sw"><div class="b" style="box-shadow:var(--shadow-paper)"></div><span>paper</span><span class="l">na papiru</span></div>
<div class="sw"><div class="b o" style="box-shadow:var(--shadow-sm)"></div><span>sm</span><span class="l">pločica, gumb</span></div>
<div class="sw"><div class="b o" style="box-shadow:var(--shadow-object)"></div><span>object</span><span class="l">pečat, pribor</span></div>
<div class="sw"><div class="b" style="box-shadow:var(--shadow-sheet)"></div><span>sheet</span><span class="l">list na stolu</span></div>
<div class="sw"><div class="b" style="box-shadow:var(--shadow-lift)"></div><span>lift</span><span class="l">podignut list</span></div>
</div></div>
<div class="sw"><h2>Pokret</h2><div class="m">
<div class="sw"><div class="track"><div class="dot" style="animation-duration:.18s;animation-timing-function:var(--ease-spring)"></div></div><span>dur-1 · .18s</span><span class="l">hover, boja</span></div>
<div class="sw"><div class="track"><div class="dot" style="animation-duration:.5s;animation-timing-function:var(--ease-spring)"></div></div><span>dur-3 · .5s · spring</span><span class="l">ladica, list, raspored</span></div>
<div class="sw"><div class="track"><div class="dot" style="animation-duration:.5s;animation-timing-function:var(--ease-stamp)"></div></div><span>stamp</span><span class="l">samo pečati</span></div>
</div></div>
<div class="sw"><h2>Razmaci</h2><div class="g"><span><i style="width:4px"></i>4</span><span><i style="width:8px"></i>8</span><span><i style="width:12px"></i>12</span><span><i style="width:16px"></i>16</span><span><i style="width:24px"></i>24</span><span><i style="width:32px"></i>32</span><span><i style="width:48px"></i>48</span></div></div>
</div></body></html>
