<!DOCTYPE html>
<html lang="hr">
<head>
<title>Navigacija</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Inter+Tight:wght@400;500;600;650;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  color-scheme:dark;
  --desk:#191512;--desk-2:#211C17;--desk-ink:#EDE7DC;
  --desk-muted:rgba(237,231,220,.72);--desk-faint:rgba(237,231,220,.60);--desk-line:rgba(237,231,220,.14);
  --paper:#F7F3E8;--paper-2:#EFE9D9;--paper-ink:#26221B;--paper-muted:#6E6656;--paper-line:#DCD4BF;
  --red:#E4573D;--red-deep:#C4372E;--red-soft:rgba(196,55,46,.12);--on-red:#1A1512;--red-on-soft:#A62B23;
  --pass:#34996A;--pass-soft:rgba(52,153,106,.14);--ok-on-soft:#176243;
  --scan:#4A6CF0;--lamp:rgba(255,214,150,.15);
  --warn:#C98A2E;--warn-soft:rgba(201,138,46,.15);--warn-strong:#C98A2E;
  --paper-sh:0 3px 8px rgba(0,0,0,.35),0 22px 60px rgba(0,0,0,.55);
  --paper-sh-sm:0 2px 6px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
  --ease:cubic-bezier(.22,1,.36,1);
  --display-serif:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-doc:Georgia,"Times New Roman",serif;
  --radius:2px;--radius-pill:999px;
  --focus:0 0 0 2px var(--paper),0 0 0 4px var(--red);
}
[data-theme="light"]{
  color-scheme:light;
  --desk:#DFD8C6;--desk-2:#D6CEB9;--desk-ink:#26221B;
  --desk-muted:#5F5645;--desk-faint:#5F5645;--desk-line:rgba(38,34,27,.16);
  --paper:#FDFBF3;--paper-2:#F3EEDF;--paper-line:#E0D9C6;
  --red:#C4372E;--red-deep:#A62B23;--red-soft:rgba(196,55,46,.1);--on-red:#F7F3E8;--red-on-soft:#A62B23;
  --pass:#17663F;--pass-soft:rgba(23,102,63,.12);--ok-on-soft:#176243;
  --warn:#B77416;--warn-soft:rgba(183,116,22,.14);--warn-strong:#8A570E;
  --scan:#1D3FBF;--lamp:rgba(255,255,255,.25);
  --paper-sh:0 2px 5px rgba(60,50,30,.18),0 18px 44px rgba(60,50,30,.25);
  --paper-sh-sm:0 1px 4px rgba(60,50,30,.15),0 8px 22px rgba(60,50,30,.18);
}
html,body{height:auto}
body{margin:0;background:var(--desk);color:var(--desk-ink);font:15px/1.5 var(--ui);padding:26px}
.dsc-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.dsc-item{display:grid;gap:9px;justify-items:start}
.dsc-cap{font:600 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--desk-faint)}
.dsc-h{font-family:var(--display-serif);font-optical-sizing:auto;font-weight:500;font-size:1.3rem;margin:0 0 4px;color:var(--desk-ink)}
.dsc-sub{margin:0 0 20px;color:var(--desk-muted);font-size:.85rem;max-width:60ch}
.dsc-block{padding:20px;border:1px solid var(--desk-line);border-radius:4px}
</style>
<style>
body{padding:0}
.topbar{background:color-mix(in srgb,var(--desk) 96%,transparent);border-bottom:1px solid var(--desk-line)}
.nav{max-width:1000px;margin:0 auto;height:66px;display:flex;align-items:center;gap:26px;padding:0 26px}
.logo{display:inline-flex;align-items:center;gap:12px;color:var(--desk-ink);text-decoration:none;font-family:var(--display-serif)}
.ks-mark{position:relative;width:30px;height:30px;flex:none;background:var(--desk-ink);color:var(--desk);display:grid;place-items:center;font-weight:600;font-size:19px}
.ks-tick{position:absolute;right:-4px;bottom:-4px;width:13px;height:13px;background:var(--red);color:#F7F3E8;display:grid;place-items:center}
.ks-tick svg{width:9px;height:9px;display:block}
.logo-word{font-style:italic;font-weight:500;font-size:27px;letter-spacing:-.01em;color:var(--desk-ink)}
.nav-links{display:flex;align-items:center;gap:3px;margin-left:auto;font-family:var(--ui);font-size:14.5px}
.nav-links a{position:relative;color:var(--desk-muted);font-weight:500;text-decoration:none;padding:7px 11px;border-radius:4px}
.nav-links a:hover{color:var(--desk-ink)}
.nav-cta{background:var(--red);color:var(--on-red);text-transform:uppercase;font-size:12.5px;letter-spacing:.05em;padding:11px 18px;border-radius:9px;text-decoration:none;font-family:var(--ui);font-weight:650}
.mobile-strip{max-width:420px;margin-top:36px auto 0;background:var(--desk-2);border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.hamburger{width:22px;height:16px;display:grid;gap:4px}
.hamburger i{display:block;height:2px;background:var(--desk-ink);border-radius:1px}
</style>
</head>
<body>
<div class="dsc-cap" style="padding:26px 26px 0">Desktop</div>
<header class="topbar">
  <nav class="nav">
    <a class="logo" href="#"><span class="ks-mark">L<span class="ks-tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l5 5L20 6"/></svg></span></span><span class="logo-word">Lekta</span></a>
    <div class="nav-links">
      <a href="#">Kako radi</a>
      <a href="#">Alati</a>
      <a href="#">Paketi</a>
      <a href="#">Moji radovi</a>
    </div>
    <a class="nav-cta" href="#">Provjeri rad</a>
  </nav>
</header>

<div style="padding:26px">
<div class="dsc-cap" style="margin-bottom:10px">Mobitel (svinuto na hamburger, ispod 1160px)</div>
<div class="mobile-strip">
  <span class="logo" style="font-size:.95rem"><span class="ks-mark" style="width:24px;height:24px;font-size:15px">L</span><span class="logo-word" style="font-size:19px">Lekta</span></span>
  <span class="hamburger"><i></i><i></i><i></i></span>
</div>
</div>
</body>
</html>
