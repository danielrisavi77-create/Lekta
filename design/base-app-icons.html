<!DOCTYPE html><html lang="hr"><head><meta charset="utf-8"><title>Lekta ikone</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
html,body{margin:0}body{background:#1C1915;color:#F7F3E8;font-family:'Geist Mono',ui-monospace,monospace;padding:40px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;align-items:end}
a{color:#F7F3E8}a:hover{color:#E4573D}
figure{margin:0;display:grid;gap:14px;justify-items:center}figcaption{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#B8AE96;text-align:center;line-height:1.6}
.ic{display:block}
</style></head><body>
<figure><svg class="ic" width="160" height="160" viewBox="0 0 64 64" role="img" aria-label="Lekta ikona"><rect width="64" height="64" rx="14" fill="#F7F3E8"/><g transform="rotate(-9 32 32)"><rect x="9" y="15" width="46" height="34" rx="2" fill="none" stroke="#C4372E" stroke-width="3"/><text x="32" y="42" text-anchor="middle" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="30" fill="#C4372E">L</text></g></svg><figcaption>apple-touch-icon<br>180×180, papir + pečat</figcaption></figure>
<figure><svg class="ic" width="160" height="160" viewBox="0 0 64 64" role="img" aria-label="Lekta maskable"><rect width="64" height="64" fill="#C4372E"/><g transform="rotate(-9 32 32)"><rect x="11" y="17" width="42" height="30" rx="2" fill="none" stroke="#F7F3E8" stroke-width="3"/><text x="32" y="41" text-anchor="middle" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="27" fill="#F7F3E8">L</text></g></svg><figcaption>maskable 512<br>crveni pečat, safe zone 80%</figcaption></figure>
<figure><svg class="ic" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="favicon 32"><rect width="64" height="64" fill="#191512"/><g transform="rotate(-9 32 32)"><rect x="8" y="14" width="48" height="36" rx="2" fill="none" stroke="#E4573D" stroke-width="4"/><text x="32" y="44" text-anchor="middle" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="32" fill="#F7F3E8">L</text></g></svg><figcaption>favicon.svg<br>tamni stol, 32 i 16 px</figcaption></figure>
<figure><svg class="ic" width="32" height="32" viewBox="0 0 64 64" role="img" aria-label="favicon 16"><rect width="64" height="64" fill="#191512"/><rect x="6" y="12" width="52" height="40" rx="2" fill="none" stroke="#E4573D" stroke-width="6"/><text x="32" y="46" text-anchor="middle" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="36" fill="#F7F3E8">L</text></svg><figcaption>16 px varijanta<br>bez rotacije, deblji okvir</figcaption></figure>
</body></html>
