<!DOCTYPE html>
<html lang="hr"><head><meta charset="utf-8"><meta name="design_doc_mode" content="canvas"><title>Početna · tri rasporeda pribora</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist Mono',monospace}a{color:inherit}a:hover{color:#E4573D}
.ab{position:absolute;width:1440px;background:#191512;color:#EDE7DC;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.badge{position:absolute;top:-58px;left:0;display:flex;align-items:baseline;gap:14px;color:#26221B}.badge b{font:600 15px 'Geist Mono';padding:5px 10px;background:#26221B;color:#F7F3E8}.badge span{font:22px 'Instrument Serif'}
.S{font-family:'Instrument Serif',Georgia,serif}.m{font-size:10.5px;letter-spacing:.14em}.f{color:rgba(237,231,220,.6)}.pm{color:#6E6656}
.lamp{position:absolute;left:50%;top:-420px;width:1500px;height:1500px;margin-left:-750px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,150,.15),rgba(255,214,150,.05) 38%,transparent 62%);pointer-events:none}
.nav{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:1180px;margin:0 auto;padding:16px 0}
.nav .l,.nav .r{display:flex;align-items:center;gap:14px}.nav .r{justify-content:flex-end;gap:8px}
.logo{display:inline-flex;align-items:center;gap:10px}.logo i{position:relative;width:30px;height:30px;background:#EDE7DC;color:#191512;display:grid;place-items:center;font:20px/1 'Instrument Serif';font-style:normal}.logo i:after{content:"";position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;background:#E4573D}.logo span{font:italic 28px 'Instrument Serif'}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid rgba(237,231,220,.16);border-radius:2px;font-size:12px}
.plate{background:linear-gradient(180deg,#CFAF6F,#A98649);color:#26221B;border-color:#6E5A34;font-size:11px}
.stage{position:relative;display:grid;grid-template-columns:640px 300px;gap:40px;justify-content:center;padding:36px 0 30px}
.sheet{position:relative;background:#F7F3E8;color:#26221B;border:1px solid #DCD4BF;border-radius:2px;box-shadow:0 3px 8px rgba(0,0,0,.35),0 22px 60px rgba(0,0,0,.55);padding:32px 56px 40px;transform:rotate(-.4deg)}
.hd{display:flex;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px solid #DCD4BF;font-size:11px;letter-spacing:.08em;color:#6E6656;white-space:nowrap}.stamp span{white-space:nowrap}.btn,.m,.foot nav a{white-space:nowrap}
.stamp{justify-self:end;display:grid;justify-items:center;gap:3px;padding:8px 14px;border:2.5px solid #C4372E;color:#A62B23;transform:rotate(-9deg)}
.cta{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;background:#E4573D;color:#F7F3E8;font-size:14px;font-weight:600;box-shadow:0 12px 28px rgba(228,87,61,.3)}
.cal{background:#F7F3E8;color:#26221B;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);transform:rotate(-1deg)}
.cal .band{display:flex;justify-content:space-between;align-items:center;height:34px;padding:0 16px;background:#C4372E;color:#F7F3E8;border-radius:2px 2px 0 0}
.cal .band em{display:flex;gap:26px}.cal .band em i{width:9px;height:9px;border-radius:50%;background:#191512}
.meter{display:flex;align-items:center;gap:18px;margin-top:34px;padding:12px 0 0;border-top:1px solid rgba(237,231,220,.16);font-size:12px;color:rgba(237,231,220,.72)}
.foot{border-top:1px solid rgba(237,231,220,.16);padding:26px 0 30px;display:grid;gap:10px;justify-items:center}
.foot nav{display:flex;gap:26px;font-size:13px;color:rgba(237,231,220,.72)}.foot nav a{text-decoration:none}.foot nav a:after{content:" ↗";font-size:10px;color:rgba(237,231,220,.4)}
.paper{background:#F3EEDF;color:#26221B;border:1px solid #DCD4BF;border-radius:2px}
.rule{display:grid;grid-template-columns:92px 1fr;align-items:baseline;min-height:28px;border-bottom:1px solid rgba(70,110,170,.18)}.rule dt{font-size:10px;letter-spacing:.08em;color:#6E6656}.rule dd{margin:0;font:17px/28px 'Instrument Serif'}
.note{position:absolute;max-width:300px;color:#26221B;font-size:12px;line-height:1.55}
</style></head><body>
<div id="root" style="position:relative;width:6260px;height:1520px"></div>
<script>
const NAV=`<div class="nav"><div class="l"><span class="logo"><i>L</i><span>Lekta</span></span><span style="width:1px;height:20px;background:rgba(237,231,220,.16)"></span><span class="btn" style="border:0">≡ Izbornik</span></div><span class="btn S" style="font-style:italic;font-size:19px;padding:0 26px">Kazalo</span><div class="r"><span class="btn" style="border:0;color:rgba(237,231,220,.72)">Moji radovi <b style="padding:2px 6px;border-radius:9px;background:#EDE7DC;color:#191512;font-size:10px">2</b></span><span class="btn plate">● FPZG · Dipl. ▾</span><span class="btn" style="padding:0"><span style="width:40px;text-align:center" class="S">Aa</span><span style="width:1px;align-self:stretch;background:rgba(237,231,220,.16)"></span><span style="width:40px;display:grid;place-items:center"><i style="width:10px;height:10px;border-radius:50%;background:rgba(255,214,150,.95);box-shadow:0 0 12px rgba(255,214,150,.9)"></i></span></span></div></div>`;
const SHEET=`<div class="sheet"><div class="hd"><span>Lekta · Ulazni list</span><span>Nº 0001 · Nepregledano</span></div><div style="display:grid;margin:18px 0 6px"><div class="stamp"><span style="font-size:10px;font-weight:600;letter-spacing:.16em">PREGLEDANO</span><span style="font-size:15px;font-weight:600">526.370 radova</span></div></div><p class="S" style="margin:0;font-style:italic;font-size:20px;color:#A62B23">Besplatna provjera · lokalno na uređaju</p><h1 class="S" style="margin:6px 0 0;font-weight:400;font-size:112px;line-height:.92;letter-spacing:-.025em">Ubaci rad.</h1><p class="S" style="margin:18px 0 0;font-size:23px;line-height:1.5;color:#5B5446">Provjerit ćemo <u style="text-decoration-color:#C4372E;text-decoration-style:wavy;text-underline-offset:6px">formu</u> prije nego ga predaš.</p><div style="display:flex;align-items:center;gap:20px;margin-top:30px"><span class="cta">Odaberi .docx ↓</span><span style="font-size:12.5px;color:#6E6656;line-height:1.7">ili ispusti dokument bilo gdje na stol<br>ili pritisni <b style="padding:1px 6px;border:1px solid #B8AE96;border-bottom-width:2px">D</b></span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:30px"><span style="width:76px;height:76px;border:2px solid #C4372E;border-radius:50%;display:grid;place-items:center;align-content:center;color:#A62B23;transform:rotate(-12deg);font-size:9.5px;letter-spacing:.12em">PRAVILNIK<b class="S" style="font-weight:400;font-size:22px;letter-spacing:0">FPZG</b>AŽ. 2. 10.</span><span style="font-size:12.5px;border-bottom:1px solid #B8AE96;padding-bottom:6px">Pogledaj primjer nalaza <span style="color:#C4372E">↻</span></span></div><div style="display:flex;justify-content:space-between;margin-top:20px;padding-top:14px;border-top:1px solid #DCD4BF;font-size:11px;color:#6E6656"><span>Dokument ostaje na uređaju</span><span>Provjeravamo formu, ne sadržaj</span></div><span style="position:absolute;right:-1px;bottom:-1px;width:30px;height:30px;background:linear-gradient(to top left,#191512 50%,#E4DAC2 50%)"></span></div>`;
const CAL=`<div class="cal"><div class="band m"><span>ROK PREDAJE</span><em><i></i><i></i></em></div><div style="padding:16px 18px 4px"><div style="display:flex;align-items:baseline;gap:10px"><span class="S" style="font-size:72px;line-height:.9">10</span><span style="font-size:12px;color:#6E6656">dana do roka</span></div><p style="margin:6px 0 0;font-size:11.5px;color:#6E6656">predaja 14. 10. 2026.</p></div><div style="padding:10px 18px 16px;border-top:1px dashed #DCD4BF;margin-top:10px;font-size:13px"><div style="border-bottom:1px solid #B8AE96;padding:12px 2px">14. 10. 2026.</div></div></div>`;
const PLANMINI=`<div style="margin:0 8px;padding:14px 16px;background:#EFE8D6;border:1px solid #DCD4BF;border-top:0;color:#26221B;box-shadow:0 10px 24px rgba(0,0,0,.35)"><div style="display:flex;justify-content:space-between" class="m pm"><span>PLAN DO ROKA</span><span style="color:#A62B23">4 TOČKE</span></div><div style="position:relative;height:30px;margin:10px 6px 0"><i style="position:absolute;left:0;right:0;top:14px;height:2px;background:#B8AE96"></i>${[0,30,62,96].map((x,i)=>`<b style="position:absolute;left:${x}%;top:3px;width:22px;height:22px;margin-left:-11px;border:2px solid ${i==3?'#C4372E':'#26221B'};border-radius:50%;background:${i==3?'#C4372E':'#FBF8F0'};color:${i==3?'#F7F3E8':'#26221B'};font-size:10px;display:grid;place-items:center">${i+1}</b>`).join('')}</div></div>`;
const METER=`<div class="meter"><span class="m f">POSLANO NA POSLUŽITELJ</span><b class="S" style="font-weight:400;font-size:28px;color:#34996A">0 B</b><span>Isključi Wi-Fi i probaj. Provjera radi i bez mreže.</span></div>`;
const FOOT=`<div class="foot"><p style="margin:0 0 6px;font-size:13px;color:rgba(237,231,220,.72)">.docx · do <b style="color:#EDE7DC">20 MB</b> · bez prijave · <u>Kako radi?</u></p><nav><a href="#">Privatnost</a><a href="#">Uvjeti</a><a href="#">Obrada dokumenata</a><a href="#">Kolačići</a><a href="#">Sve pravno</a></nav><p style="margin:0;font-size:11.5px" class="f">© 2026 Lekta · Automatska provjera je lokalna · Nije provjera plagijata ni službena potvrda fakulteta</p></div>`;
const RULES=[['MARGINE','2,5 cm, uvez +0,5 cm'],['PRORED','1,5'],['FONT','Times New Roman 12 pt'],['CITIRANJE','Harvard'],['OPSEG','diplomski 40–60 str.'],['NASLOVNICA','bez broja stranice']].map(r=>`<div class="rule"><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join('');
const head=(n,t,v,open)=>`<div style="display:grid;grid-template-columns:26px 1fr auto;align-items:baseline;gap:8px;padding:12px 16px"><span style="font-size:10.5px;color:#A62B23">${n}</span><span><span class="S" style="font-size:21px">${t}</span><small style="display:block;font-size:11px;color:#6E6656;margin-top:2px">${v}</small></span><span style="font-size:12px;color:#6E6656">${open?'−':'+'}</span></div>`;

// A: snop kartica (jedan otvoren)
const A=`<div style="display:grid;gap:0">${CAL}${PLANMINI}<div style="margin-top:22px;display:grid">
<div class="paper" style="position:relative;z-index:3;box-shadow:0 12px 30px rgba(0,0,0,.4)">${head('01','Pravila FPZG','6 ključnih, ažurirano 2. 10.',true)}<dl style="margin:0;padding:0 16px 12px">${RULES}</dl></div>
<div class="paper" style="position:relative;z-index:2;margin-top:-2px;box-shadow:0 10px 24px rgba(0,0,0,.35)">${head('02','Citat odmah','zalijepi izvor, dobiješ Harvard',false)}</div>
<div class="paper" style="position:relative;z-index:1;margin-top:-2px;box-shadow:0 10px 24px rgba(0,0,0,.35)">${head('03','Ravnalo opsega','12.000 riječi ≈ 41 str. · u rasponu',false)}</div>
</div></div>`;

// B: kartoteka s jezičcima
const tab=(t,on,ml)=>`<span style="margin-left:${ml}px;padding:8px 14px 10px;background:${on?'#F3EEDF':'#DCD3BC'};color:#26221B;border:1px solid #CFC5AC;border-bottom:0;border-radius:3px 3px 0 0;font-size:11px;letter-spacing:.06em;${on?'position:relative;z-index:2;margin-bottom:-1px':''}">${t}</span>`;
const B=`<div style="display:grid;gap:0">${CAL}${PLANMINI}<div style="margin-top:26px"><div style="display:flex;align-items:flex-end">${tab('Pravila',false,0)}${tab('Citat',true,4)}${tab('Opseg',false,4)}</div><div class="paper" style="padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.4);display:grid;gap:12px;border-radius:0 2px 2px 2px"><div style="display:flex;justify-content:space-between" class="m pm"><span>CITAT ODMAH</span><span style="color:#A62B23;letter-spacing:.04em">Harvard · FPZG</span></div><div style="padding:10px;border:1px dashed #B8AE96;font-size:12px;line-height:1.5;color:#6E6656">Horvat, Ivana. 2019. „Politička komunikacija u Hrvatskoj“. Zagreb: FPZG, str. 45–67.</div><p class="S" style="margin:0;padding:12px 14px;background:#FBF8F0;font-size:17px;line-height:1.4">Horvat, I. (2019) <i>Politička komunikacija u Hrvatskoj</i>. Zagreb: FPZG.</p><span style="font-size:11px;text-decoration:underline">Kopiraj</span></div></div></div>`;

// C: ladica stola ispod
const slot=(n,t,big,sub,act)=>`<div class="paper" style="padding:16px 18px;display:grid;gap:8px;align-content:start;min-height:150px"><span class="m pm"><span style="color:#A62B23">${n}</span> · ${t}</span><span class="S" style="font-size:30px;line-height:1.05">${big}</span><span style="font-size:11.5px;color:#6E6656;line-height:1.5">${sub}</span><span style="margin-top:auto;font-size:11.5px;color:#A62B23">${act} →</span></div>`;
const C_SIDE=`<div style="display:grid">${CAL}${PLANMINI}</div>`;
const C_TRAY=`<div style="width:980px;margin:6px auto 0;padding:14px;background:#211C17;border:1px solid rgba(237,231,220,.12);border-radius:3px;box-shadow:inset 0 2px 10px rgba(0,0,0,.5)"><div style="display:flex;justify-content:space-between;padding:0 4px 12px" class="m f"><span>LADICA STOLA · PRIBOR UZ RAD</span><span>sve lokalno</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${slot('01','PRAVILA FPZG','2,5 cm · 1,5 · Harvard','Šest ključnih pravila za diplomski, s izvorom.','Otvori sva pravila')}${slot('02','CITAT ODMAH','Zalijepi izvor','Dobiješ zapis u stilu FPZG, spreman za kopiranje.','Probaj s primjerom')}${slot('03','RAVNALO OPSEGA','≈ 41 str.','12.000 riječi · traženo 40–60 str. za diplomski.','Promijeni broj')}</div></div>`;

const page=(side,below)=>`<div class="lamp"></div>${NAV}<div class="stage"><div>${SHEET}${METER}</div>${side}</div>${below||''}${FOOT}`;

const MODAL=`<div class="lamp" style="opacity:.4"></div>${NAV}<div class="stage" style="opacity:.35;filter:blur(1px)"><div>${SHEET}</div>${C_SIDE}</div><div style="position:absolute;inset:0;background:rgba(10,8,6,.62)"></div>
<div style="position:absolute;left:50%;top:70px;width:820px;margin-left:-410px;background:#F7F3E8;color:#26221B;border-radius:2px;box-shadow:0 40px 120px rgba(0,0,0,.7);transform:rotate(-.3deg)">
<div style="display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid #DCD4BF"><span class="m pm">LEKTA · PRAVNO</span><span style="display:flex;gap:10px;align-items:center;font-size:11px;color:#6E6656">Esc <b style="width:36px;height:36px;border:1px solid #B8AE96;display:grid;place-items:center;font-size:16px;font-weight:400;color:#26221B">×</b></span></div>
<div style="display:flex;gap:4px;padding:14px 28px 0;border-bottom:1px solid #DCD4BF">${['Privatnost','Uvjeti','Obrada dokumenata','Kolačići'].map((t,i)=>`<span style="padding:10px 14px;font-size:12px;${i==0?'border-bottom:2px solid #C4372E;color:#26221B':'color:#6E6656'}">${t}</span>`).join('')}</div>
<div style="display:grid;grid-template-columns:200px 1fr;gap:36px;padding:28px 28px 8px"><ol style="margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:11.5px;color:#6E6656;align-content:start"><li style="color:#A62B23">01 Što ostaje na uređaju</li><li>02 Što pamti preglednik</li><li>03 Plaćanje</li><li>04 Tvoja prava</li><li>05 Kontakt</li></ol>
<div><h2 class="S" style="margin:0;font-weight:400;font-size:48px;line-height:1">Privatnost</h2><p style="margin:8px 0 22px;font-size:11px;color:#6E6656">Na snazi od 1. 9. 2026. · čitanje 4 min</p><h3 class="S" style="margin:0 0 6px;font-weight:400;font-size:22px">01 Što ostaje na uređaju</h3><p class="S" style="margin:0;font-size:18px;line-height:1.55;color:#3A352C;max-width:52ch">[Tekst iz Legal predloška. U modalu se prikazuje isti sadržaj kao na stranici, s kazalom lijevo i skrolom unutar lista.]</p></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding:16px 28px;border-top:1px solid #DCD4BF;font-size:11.5px;color:#6E6656"><span>Modal se zatvara s Esc, klikom izvan lista ili ×. Fokus se vraća na poveznicu.</span><u style="color:#26221B">Otvori kao stranicu ↗</u></div></div>`;

const boards=[
 ['A','Snop kartica',page(A),'Rok i plan ostaju, a ispod su tri kartice iste širine, papira i zaglavlja (broj, naslov, sažetak u jednom retku), složene u snop. Otvorena je uvijek samo jedna. Stupac je jedan predmet, a ne četiri. Na mobitelu je isti snop ispod lista.'],
 ['B','Kartoteka s jezičcima',page(B),'Rok i plan ostaju. Ispod je jedna kartica s tri jezička (Pravila, Citat, Opseg), kao razdjelnici u kartoteci. Najmirnija opcija: vidi se jedan alat, a ostali su na dohvat jezička.'],
 ['C','Ladica stola',page(C_SIDE,C_TRAY),'Uz list stoje samo rok i plan, kao jedini predmet koji ide uz ubacivanje. Tri alata su ispod u jednoj ladici s tri jednaka pretinca: isti oblik, jedna rečenica, jedna radnja. Stol iznad je najčišći, a ladica se na mobitelu lista prstom.'],
 ['P','Pravno kao modal',MODAL,'Vrijedi uz bilo koju opciju. Klik na Privatnost, Uvjeti, Obrada ili Kolačići otvara list preko stola s jezičcima za sve četiri stranice, kazalom i skrolom unutar lista. „Otvori kao stranicu“ vodi na postojeći URL (za SEO i dijeljenje).']
];
const root=document.getElementById('root');let x=60;
boards.forEach(([id,name,html,note],i)=>{const ab=document.createElement('section');ab.className='ab';ab.id=id;ab.style.left=x+'px';ab.style.top='120px';ab.style.height=(id==='C'?1240:1100)+'px';ab.innerHTML=html;root.appendChild(ab);const bd=document.createElement('div');bd.className='badge';bd.style.cssText='position:absolute;left:'+x+'px;top:62px';bd.innerHTML=`<b>${id}</b><span>${name}</span>`;root.appendChild(bd);
const n=document.createElement('p');n.className='note';n.style.left=x+'px';n.style.top=(id==='C'?1390:1250)+'px';n.style.maxWidth='900px';n.textContent=note;root.appendChild(n);x+=1540;});
</script>
</body></html>
