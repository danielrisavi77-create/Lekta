<!DOCTYPE html>
<html lang="hr"><head><meta charset="utf-8"><title>Lekta</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0}body{width:1280px;height:854px;display:grid;grid-template-columns:960px 320px;overflow:hidden;background:#C4372E}.main{background:#C4372E;display:flex;align-items:center;justify-content:center}.name{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-style:italic;font-size:300px;line-height:1;letter-spacing:-.02em;color:#F7F3E8;margin:0}.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip div{width:100%;height:100%}a{color:#F7F3E8}a:hover{color:#EFE9D9}</style></head>
<body><div class="main"><h1 class="name">Lekta</h1></div><div class="strip"><div style="background:#C98A2E"></div><div style="background:#34996A"></div><div style="background:#4A6CF0"></div><div style="background:#191512"></div></div></body></html>
